name: RT-DETR-L
task: detection
framework: ultralytics
weights: weights/rtdetr-l.pt
input_size: [224, 224]
batch_size: 64
epochs: 20
learning_rate: 0.001
label_format: yolo_full_image_box
augmentation:
  mixup: 0.1
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 10
  translate: 0.1
  scale: 0.5
  shear: 0.2
  perspective: 0.0005
metrics:
  - precision
  - recall
  - map50
  - map50_95
