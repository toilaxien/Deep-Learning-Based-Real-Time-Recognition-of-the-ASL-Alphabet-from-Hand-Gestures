name: Vision Transformer
task: classification
framework: pytorch_timm
architecture: vit_base_patch16_224
weights: weights/ViT.pth
input_size: [224, 224]
batch_size: 256
epochs: 70
optimizer: AdamW
learning_rate: 0.0001
weight_decay: 0.0001
scheduler: CosineAnnealingLR
preprocessing:
  resize: [224, 224]
  normalize_mean: [0.5, 0.5, 0.5]
  normalize_std: [0.5, 0.5, 0.5]
augmentation:
  random_rotation_degrees: 10
  random_affine_translate: [0.05, 0.05]
  random_resized_crop_scale: [0.95, 1.05]
  random_horizontal_flip: 0.5
metrics:
  - accuracy
  - precision_macro
  - recall_macro
  - f1_macro
